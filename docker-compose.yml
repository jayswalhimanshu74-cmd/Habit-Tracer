version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: habit-tracer-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-habittracker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Optionally automatically load the schema on first startup:
      - ./server/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
